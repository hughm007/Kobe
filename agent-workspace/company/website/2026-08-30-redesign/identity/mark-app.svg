<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Service Pow">
  <!-- App mark / favicon. Direction A's frame, reduced to solid mass: the brackets are
       knocked out of a filled tile, so nothing depends on a hairline surviving at 16px.
       Drawn on a 32-unit grid because 32x32 is a real favicon size, not an abstraction. -->
  <rect width="32" height="32" rx="7" fill="#17457A"/>
  <g fill="none" stroke="#FAF8F5" stroke-width="4" stroke-linecap="square">
    <path d="M7 15.5 V7 H15.5"/>
    <path d="M25 16.5 V25 H16.5"/>
  </g>
</svg>

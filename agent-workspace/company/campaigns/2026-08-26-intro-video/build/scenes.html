<!doctype html>
<meta charset="utf-8">
<title>Service Pow intro — deterministic frame renderer</title>
<style>
  :root{
    --ground:#F7F5F0;
    --ink:#1A1A1A;
    --accent:#1B5FA8;          /* PROVISIONAL. One line changes the whole film. */
    --plate:#232323;
    --light:#E8E4DC;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000}
  #stage{position:relative;width:1920px;height:1080px;background:var(--ground);overflow:hidden;
         font-family:'Liberation Sans',Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
  #art{position:absolute;inset:0;width:1920px;height:1080px}
  #txt{position:absolute;inset:0;pointer-events:none}
  .t{position:absolute;color:var(--ink);line-height:1.15;white-space:pre-wrap}
  .t.c{text-align:center;transform:translate(-50%,-50%)}
  .t.l{text-align:left;transform:translate(0,-50%)}
  .wm{font-weight:700;letter-spacing:.20em}
  .bug{opacity:.40}
</style>

<div id="stage">
  <svg id="art" viewBox="0 0 1920 1080" shape-rendering="geometricPrecision">
    <defs>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="14"/>
      </filter>
      <linearGradient id="plateGrad" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#8C8A85"/><stop offset="0.55" stop-color="#6E6C67"/>
        <stop offset="1" stop-color="#4A4845"/>
      </linearGradient>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#AFC2D4"/><stop offset="1" stop-color="#EDE7DC"/>
      </linearGradient>
    </defs>
    <g id="scene"></g>
  </svg>
  <div id="txt"></div>
</div>

<script>
/* =====================================================================
   Service Pow intro video — deterministic renderer.
   Every visible pixel is a pure function of the frame number.
   No requestAnimationFrame, no CSS transition, no unseeded randomness.
   render(N) twice always produces identical output.
   ===================================================================== */

const FPS = 30, TOTAL = 1800;              /* 60.000s */
let CURF = 0;                              /* current frame, for the boil */
const BOIL_ON = 3;                         /* redraw the wobble every 3 frames (10 Hz, 'on threes') */
const boil = () => Math.floor(CURF / BOIL_ON) * 7919;
const CUT = new URLSearchParams(location.search).get('cut') || 'control';
const W = 1920, H = 1080;
const ACCENT = '#1B5FA8', INK = '#1A1A1A', GROUND = '#F7F5F0',
      PLATE = '#232323', LIGHT = '#E8E4DC';

/* ---------- math ---------- */
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const seg=(t,a,b)=>b<=a?(t>=b?1:0):clamp((t-a)/(b-a),0,1);
const easeOut=p=>1-Math.pow(1-p,3);
const easeIn =p=>p*p*p;
const easeIO =p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const lerp=(a,b,p)=>a+(b-a)*p;
/* seeded PRNG so any "hand wobble" is identical on every render */
function rnd(seed){let s=seed>>>0;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;}}

/* ---------- svg helpers ---------- */
const A=[];                                   /* art accumulator for this frame */
function push(s){A.push(s)}
/* draw-on stroke: pathLength normalised so one dash covers any path */
function P(d,p,o={}){
  if(p<=0) return '';
  const st=o.stroke||INK, sw=o.w||5, op=o.opacity==null?1:o.opacity;
  return `<path d="${d}" fill="none" stroke="${st}" stroke-width="${sw}" opacity="${op}"`
       + ` stroke-linecap="round" stroke-linejoin="round" pathLength="1"`
       + ` stroke-dasharray="1" stroke-dashoffset="${(1-p).toFixed(5)}"/>`;
}
function F(d,o={}){                            /* filled shape, no draw-on */
  const f=o.fill||INK, op=o.opacity==null?1:o.opacity;
  return `<path d="${d}" fill="${f}" opacity="${op.toFixed(4)}" stroke="none"/>`;
}
const rectD=(x,y,w,h)=>`M ${x} ${y} L ${x+w} ${y} L ${x+w} ${y+h} L ${x} ${y+h} Z`;
const lineD=(x1,y1,x2,y2)=>`M ${x1} ${y1} L ${x2} ${y2}`;
function circD(cx,cy,r){                       /* one-path circle, draws clockwise from top */
  return `M ${cx} ${cy-r} A ${r} ${r} 0 1 1 ${cx-0.01} ${cy-r} Z`;
}
/* a hand-drawn rectangle: same corners, slight wobble, deterministic per seed */
function wobbleRect(x,y,w,h,seed,amp=3){
  const r=rnd(seed+boil()), o=()=> (r()-0.5)*2*amp;
  return `M ${x+o()} ${y+o()} L ${x+w+o()} ${y+o()} L ${x+w+o()} ${y+h+o()} L ${x+o()} ${y+h+o()} Z`;
}
/* hand-drawn line: subdivided, seeded jitter, boils like every other stroke (R12).
   Straight ruler lines are off-style in a marker film; this replaces lineD at draw sites. */
function wline(x1,y1,x2,y2,seed,amp=2.2){
  const q=rnd((seed||((x1*13+y2*7)|0))+boil()), o=()=>(q()-0.5)*2*amp;
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), n=Math.max(2,Math.round(L/90));
  let d=`M ${x1+o()} ${y1+o()}`;
  for(let i=1;i<=n;i++) d+=` L ${x1+dx*i/n+o()} ${y1+dy*i/n+o()}`;
  return d;
}
/* rounded hand-drawn rect — the square-cornered wobbleRect above stays as the control uses it */
function wobRound(x,y,w,h,seed,amp=3,r=20){
  const q=rnd(seed+boil()), o=()=>(q()-0.5)*2*amp;
  return `M ${x+r+o()} ${y+o()} L ${x+w-r+o()} ${y+o()} Q ${x+w+o()} ${y+o()} ${x+w+o()} ${y+r+o()}`
       + ` L ${x+w+o()} ${y+h-r+o()} Q ${x+w+o()} ${y+h+o()} ${x+w-r+o()} ${y+h+o()}`
       + ` L ${x+r+o()} ${y+h+o()} Q ${x+o()} ${y+h+o()} ${x+o()} ${y+h-r+o()}`
       + ` L ${x+o()} ${y+r+o()} Q ${x+o()} ${y+o()} ${x+r+o()} ${y+o()} Z`;
}
function grp(inner,tf,op){
  return `<g${tf?` transform="${tf}"`:''}${op!=null?` opacity="${op.toFixed(4)}"`:''}>${inner}</g>`;
}

/* =====================================================================
   BURNED TEXT — the table in script.md §3, encoded once.
   ===================================================================== */
const TEXTS=[
 {id:'T1', s:'One ad. One guess.',            in:3.4, out:6.6, x:960, y:830, sz:64, a:'c', w:900},
 {id:'T2', s:'SERVICE POW',                   in:8.0, out:15.0,x:960, y:430, sz:104,a:'c', w:1400, cls:'wm'},
 {id:'T3', s:'video ads',                     in:10.6,out:14.6,x:560, y:790, sz:38, a:'c', w:400},
 {id:'T4', s:'websites',                      in:11.6,out:14.6,x:960, y:790, sz:38, a:'c', w:400},
 {id:'T5', s:'social',                        in:12.6,out:14.6,x:1360,y:790, sz:38, a:'c', w:400},
 {id:'T6', s:'2 concepts × 2 hooks',     in:16.4,out:20.4,x:960, y:150, sz:54, a:'c', w:1200},
 {id:'T7', s:'4 finished ads',                in:20.2,out:23.0,x:960, y:1010,sz:60, a:'c', w:1200},
 {id:'T8', s:'5–7 days from your footage',in:23.2,out:25.8,x:960,y:1010,sz:46, a:'c', w:1200},
 {id:'T9', s:'Your footage stays the hero',   in:29.4,out:33.0,x:960, y:960, sz:56, a:'c', w:1400},
 {id:'T10',s:'AI builds the rest',            in:33.2,out:36.2,x:960, y:960, sz:56, a:'c', w:1400},
 {id:'T11',s:'Disclosure handled',            in:38.6,out:44.4,x:262, y:420, sz:54, a:'l', w:820},
 {id:'T12',s:'No fake testimonials',          in:40.4,out:44.4,x:262, y:540, sz:54, a:'l', w:820},
 {id:'T13',s:'Claims substantiated',          in:42.2,out:44.4,x:262, y:660, sz:54, a:'l', w:820},
 {id:'T14',s:'The page it lands on',          in:46.4,out:49.4,x:960, y:950, sz:52, a:'c', w:1200},
 {id:'T15',s:'Captions. End cards. Titles.',  in:49.6,out:52.4,x:960, y:950, sz:52, a:'c', w:1200},
 {id:'T16',s:'We make the first one before you ask.',in:54.0,out:57.2,x:960,y:930,sz:56,a:'c',w:1500},
 {id:'T17',s:'SERVICE POW',                   in:57.4,out:60.0,x:960, y:470, sz:112,a:'c', w:1500, cls:'wm'},
 {id:'T18',s:'servicepow.com',                in:58.0,out:60.0,x:960, y:625, sz:42, a:'c', w:900}
];
const FADE=0.15;

/* =====================================================================
   SCENE PARTS
   ===================================================================== */

/* ---- S1 HOOK : one ad, one question mark ----
   The lone ad is drawn in the SAME sketch vocabulary the grid uses at 15.0s,
   so S4's snap pays off a shape the viewer met in the first two seconds. */
function s1(t){
  const o=[];
  o.push(adSketch(420,270,800,450,1,seg(t,0.6,2.6),101));
  const q=seg(t,2.4,3.2);
  o.push(P('M 1360 380 C 1360 310, 1500 302, 1500 380 C 1500 442, 1430 450, 1430 516', q, {w:8}));
  o.push(P('M 1430 576 L 1430 584', seg(t,3.2,3.35), {w:12}));
  const dim = 1 - 0.62*easeIO(seg(t,5.0,7.0));
  return grp(o.join(''), null, dim);
}

/* ---- S2 WHO : wordmark + three live services ---- */
function iconFilm(x,y,s,p){
  const o=[]; const w=s, h=s*0.66;
  o.push(P(wobbleRect(x-w/2,y-h/2,w,h,201,2), clamp(p*2,0,1), {w:5}));
  const q=clamp(p*2-1,0,1);
  for(let i=0;i<3;i++){
    const yy=y-h/2+14+i*(h-28)/2.6;
    o.push(P(rectD(x-w/2+10,yy,16,16), clamp(q*3-i,0,1), {w:3}));
    o.push(P(rectD(x+w/2-26,yy,16,16), clamp(q*3-i,0,1), {w:3}));
  }
  return o.join('');
}
function iconBrowser(x,y,s,p){
  const o=[]; const w=s, h=s*0.72;
  o.push(P(wobbleRect(x-w/2,y-h/2,w,h,202,2), clamp(p*2,0,1), {w:5}));
  const q=clamp(p*2-1,0,1);
  o.push(P(lineD(x-w/2,y-h/2+30,x+w/2,y-h/2+30), q, {w:4}));
  for(let i=0;i<3;i++) o.push(P(circD(x-w/2+22+i*22,y-h/2+15,5), clamp(q*3-i,0,1), {w:3}));
  o.push(P(lineD(x-w/2+22,y+6,x+w/2-60,y+6), q, {w:4,opacity:.7}));
  o.push(P(lineD(x-w/2+22,y+36,x+w/2-30,y+36), q, {w:4,opacity:.7}));
  return o.join('');
}
function iconPhone(x,y,s,p){
  const o=[]; const w=s*0.52, h=s*0.86;
  o.push(P(wobbleRect(x-w/2,y-h/2,w,h,203,2), clamp(p*2,0,1), {w:5}));
  const q=clamp(p*2-1,0,1);
  o.push(P(lineD(x-w/2+14,y-h/2+26,x+w/2-14,y-h/2+26), q, {w:4}));
  o.push(P(circD(x,y+h/2-24,9), q, {w:3}));
  return o.join('');
}
function s2(t){
  const o=[];
  o.push(P(lineD(650,522,1270,522), seg(t,9.6,10.2), {stroke:ACCENT,w:9}));
  o.push(iconFilm   (560, 640,190, seg(t,10.2,10.9)));
  o.push(iconBrowser(960, 640,190, seg(t,11.2,11.9)));
  o.push(iconPhone  (1360,640,190, seg(t,12.2,12.9)));
  return o.join('');
}

/* ---- S3/S4 PACKS : the 2x2 grid and THE SNAP ---- */
const CELLS=[[320,250],[980,250],[320,620],[980,620]];
const CW=620, CH=330;
const VAR=[
 {hz:.62, subj:[.10,.28,.30,.34], acc:{k:'bar', b:[.62,.68,.30,.09]}, cap:[.05,.50]},
 {hz:null,subj:[.30,.18,.40,.52], acc:{k:'circ',c:[.83,.24,.095]},    cap:[.05,.38]},
 {hz:.55, subj:[.56,.22,.34,.33], acc:{k:'diag',d:[.04,.50,.34,.16]}, cap:[.44,.50]},
 {hz:null,subj:[.36,.34,.28,.40], acc:{k:'band',b:[0,.05,1,.13]},     cap:[.05,.44]}
];
/* One ad, sketched then finished. Used at four sizes: the lone hook ad (S1),
   the four grid cells (S3/S4) and the annotated compliance ad (S7). */
function adSketch(x,y,w,h,v,p,seed){
  const o=[], V=VAR[v], U=u=>x+u*w, Y=q=>y+q*h;
  o.push(P(wobbleRect(x,y,w,h,seed,3), clamp(p*2.2,0,1), {w:5}));
  const q=clamp(p*2.2-1.2,0,1);
  if(V.hz) o.push(P(lineD(x+12,Y(V.hz),x+w-12,Y(V.hz)), clamp(q*3,0,1), {w:4,opacity:.8}));
  const s=V.subj;
  o.push(P(wobbleRect(U(s[0]),Y(s[1]),s[2]*w,s[3]*h,seed+20,2), clamp(q*3-0.6,0,1), {w:4,opacity:.85}));
  const a=V.acc, q3=clamp(q*3-1.4,0,1);
  if(a.k==='bar')  o.push(P(rectD(U(a.b[0]),Y(a.b[1]),a.b[2]*w,a.b[3]*h), q3, {w:4,opacity:.8}));
  if(a.k==='circ') o.push(P(circD(U(a.c[0]),Y(a.c[1]),a.c[2]*h), q3, {w:4,opacity:.8}));
  if(a.k==='diag') o.push(P(lineD(U(a.d[0]),Y(a.d[1]),U(a.d[2]),Y(a.d[3])), q3, {w:4,opacity:.8}));
  if(a.k==='band') o.push(P(rectD(U(a.b[0])+6,Y(a.b[1]),a.b[2]*w-12,a.b[3]*h), q3, {w:4,opacity:.8}));
  o.push(P(rectD(U(V.cap[0])+8,y+h-h*0.17,V.cap[1]*w,h*0.105), clamp(q*3-2,0,1), {w:4,opacity:.7}));
  const px=x+w/2, py=y+h*0.46;
  o.push(P(`M ${px-w*0.026} ${py-h*0.066} L ${px+w*0.039} ${py} L ${px-w*0.026} ${py+h*0.066} Z`,
           clamp(q*3-2.4,0,1), {w:4,opacity:.55}));
  return o.join('');
}
function adFinal(x,y,w,h,v){
  const o=[], V=VAR[v], U=u=>x+u*w, Y=q=>y+q*h;
  o.push(F(rectD(x,y,w,h),{fill:PLATE}));
  if(V.hz) o.push(F(rectD(x,y,w,V.hz*h),{fill:'#2E2E2E'}));
  const a=V.acc;
  if(a.k==='bar')  o.push(F(rectD(U(a.b[0]),Y(a.b[1]),a.b[2]*w,a.b[3]*h),{fill:ACCENT}));
  if(a.k==='circ') o.push(F(circD(U(a.c[0]),Y(a.c[1]),a.c[2]*h),{fill:ACCENT}));
  if(a.k==='diag') o.push(`<path d="M ${U(a.d[0])} ${Y(a.d[1])} L ${U(a.d[2])} ${Y(a.d[3])} L ${U(a.d[0])} ${Y(a.d[1])-h*0.32} Z" fill="${ACCENT}" opacity="0.9"/>`);
  if(a.k==='band') o.push(F(rectD(U(a.b[0]),Y(a.b[1]),a.b[2]*w,a.b[3]*h),{fill:ACCENT}));
  const s=V.subj;
  o.push(F(rectD(U(s[0]),Y(s[1]),s[2]*w,s[3]*h),{fill:LIGHT}));
  const cx0=U(V.cap[0])+8, cy0=y+h-h*0.17, cw=V.cap[1]*w, ch=h*0.105;
  o.push(F(rectD(cx0,cy0,cw,ch),{fill:'#F2EFE8',opacity:.94}));
  o.push(F(rectD(cx0+14,cy0+ch*0.24,cw*0.55,h*0.021),{fill:'#3A3A3A'}));
  o.push(F(rectD(cx0+14,cy0+ch*0.58,cw*0.36,h*0.021),{fill:'#6A6A6A'}));
  const px=x+w/2, py=y+h*0.46;
  o.push(`<path d="M ${px-w*0.026} ${py-h*0.066} L ${px+w*0.039} ${py} L ${px-w*0.026} ${py+h*0.066} Z" fill="#FFFFFF" opacity="0.22"/>`);
  o.push(P(wobbleRect(x,y,w,h,seed_edge(x,y),1.6),1,{w:3,opacity:.42,stroke:'#000'}));
  return o.join('');
}
const seed_edge=(x,y)=>((x*31+y*17)|0)+5000;
const cellSketch=(x,y,v,p)=>adSketch(x,y,CW,CH,v,p,300+v);
const cellFinal =(x,y,v)  =>adFinal (x,y,CW,CH,v);

function s34(t,f){
  const o=[];
  const SNAP=Math.round(20.4*FPS);                       /* frame 612 */
  for(let i=0;i<4;i++){
    const [x,y]=CELLS[i];
    const drawP  = seg(t,15.4+i*0.15,16.4+i*0.15);
    const compP  = seg(t,17.0+i*0.55,19.0+i*0.55);
    const snapped= f>=SNAP;
    if(snapped){
      const k=clamp((f-SNAP)/4,0,1);                     /* 4-frame overshoot settle */
      const sc=1+0.030*(1-easeOut(k));
      const cx=x+CW/2, cy=y+CH/2;
      o.push(grp(cellFinal(x,y,i), `translate(${cx} ${cy}) scale(${sc.toFixed(5)}) translate(${-cx} ${-cy})`));
    } else {
      o.push(cellSketch(x,y,i, Math.max(drawP*0.45, 0.45+compP*0.55)));
    }
  }
  /* counter 1..4 lands after the snap */
  for(let i=0;i<4;i++){
    const cp=seg(t,21.0+i*0.4,21.25+i*0.4);
    if(cp>0){
      const [x,y]=CELLS[i];
      o.push(`<g opacity="${cp.toFixed(3)}"><circle cx="${x+44}" cy="${y+44}" r="26" fill="${ACCENT}"/>`+
             `<text x="${x+44}" y="${y+56}" font-family="Liberation Sans,Arial" font-size="34" font-weight="700"`+
             ` fill="#FFFFFF" text-anchor="middle">${i+1}</text></g>`);
    }
  }
  /* the only camera move in the film: 4% push-in across the offer */
  const sc=lerp(1,1.04,easeIO(seg(t,15.0,26.0)));
  return grp(o.join(''), `translate(${W/2} ${H/2}) scale(${sc.toFixed(5)}) translate(${-W/2} ${-H/2})`);
}

/* ---- S5/S6 REAL+AI : the plate that never changes ----
   The plate is deliberately large and crosses the horizon, so it reads as the
   SUBJECT of a built scene rather than a screen sitting inside another screen. */
const FX=290, FY=112, FW=1340, FH=754;
const HZ=FY+562;
const PX=740, PY=252, PW=440, PH=548;
function envSketch(p){
  const o=[];
  o.push(P(lineD(FX+18,HZ,FX+FW-18,HZ), clamp(p*3,0,1), {w:4,opacity:.8}));
  o.push(P(wobbleRect(FX+70,HZ-300,210,300,401,3), clamp(p*3-0.5,0,1), {w:4,opacity:.8}));
  o.push(P(wobbleRect(FX+FW-300,HZ-372,230,372,402,3), clamp(p*3-0.9,0,1),{w:4,opacity:.8}));
  o.push(P(lineD(FX+60,FY+120,FX+390,FY+120), clamp(p*3-1.4,0,1), {w:4,opacity:.5}));
  o.push(P(lineD(FX+FW-420,FY+86,FX+FW-60,FY+86), clamp(p*3-1.7,0,1),{w:4,opacity:.5}));
  return o.join('');
}
function envFinal(op,dx2,dx3){
  const o=[];
  o.push(F(rectD(FX+4,FY+4,FW-8,HZ-FY-4),{fill:'url(#skyGrad)',opacity:op}));
  o.push(grp(F(rectD(FX+60,FY+108,330,26),{fill:'#AEBCC8',opacity:op*.9})+
             F(rectD(FX+FW-420,FY+74,360,26),{fill:'#AEBCC8',opacity:op*.9}), `translate(${dx3} 0)`));
  o.push(grp(F(rectD(FX+70,HZ-300,210,300),{fill:'#78848E',opacity:op})+
             F(rectD(FX+FW-300,HZ-372,230,372),{fill:'#66717B',opacity:op}), `translate(${dx2} 0)`));
  o.push(F(rectD(FX+4,HZ,FW-8,FY+FH-HZ-4),{fill:'#565450',opacity:op}));
  return o.join('');
}
function plate(){
  const o=[], m=24;
  o.push(`<rect x="${PX+12}" y="${PY+16}" width="${PW}" height="${PH}" fill="#000" opacity="0.30" filter="url(#soft)"/>`);
  o.push(F(rectD(PX,PY,PW,PH),{fill:'url(#plateGrad)'}));
  o.push(`<rect x="${PX}" y="${PY}" width="${PW}" height="${PH}" filter="url(#grain)" opacity="0.20"/>`);
  /* film-frame corner ticks — says "this is footage" without inventing content */
  for(const [x,y,sx,sy] of [[PX,PY,1,1],[PX+PW,PY,-1,1],[PX,PY+PH,1,-1],[PX+PW,PY+PH,-1,-1]]){

/* =====================================================================

   What v4 got wrong: a symmetric blob under the phone, two open loops, a
   floating thumb, an open cuff curve. v5 draws only what a photo shows:
     · forearm entering from the bottom frame edge (the crop IS the body)
     · palm heel + thumb-web bulge at the lower right, behind the phone
     · pinky peeking under the bottom edge (the classic phone grip)
     · three fingertips wrapping the LEFT edge — closed capsules w/ nails
     · thumb up the RIGHT bezel, base merged into the palm bulge
   Every path is CLOSED or hidden behind the phone body fill. No open ends.
   ===================================================================== */
function handPhone(cx, cy, sc, o2={}){
  const g=[], S=v=>v*sc;
  const PW=S(300), PH=S(560), px=cx-PW/2, py=cy-PH/2, bot=py+PH, right=px+PW;
  const dr = o2.draw==null?1:o2.draw;

     the phone are never exposed mid-draw. */

  /* ---- 1 · pinky under the bottom edge, tip peeking at the lower-left corner ---- */

      +` C ${px+S(118)+J()} ${bot+S(104)+J()}, ${WLx-S(30)+J()} ${WLy-S(60)+J()}, ${WLx+J()} ${WLy+J()}`
      +` L ${mLx+J()} ${mLy+J()} L ${ELx} ${ELy}`                      /* off frame */
      +` L ${ERx} ${ERy} L ${mRx+J()} ${mRy+J()} L ${WRx+J()} ${WRy+J()}`
      +` C ${right+S(46)+J()} ${bot+S(40)+J()}, ${right+S(58)+J()} ${bot+S(10)+J()}, ${right+S(54)+J()} ${bot-S(30)+J()}`
      +` C ${right+S(46)+J()} ${bot-S(86)+J()}, ${right+S(12)+J()} ${bot-S(130)+J()}, ${right-S(34)} ${bot-S(150)}` /* hidden */
      +` L ${px+S(150)} ${bot-S(36)} Z`;
    g.push(F(d,{fill:SKIN,opacity:p3}));

  {

      +` C ${right+S(50)+J()} ${bot-S(56)+J()}, ${right+S(32)+J()} ${bot-S(130)+J()}, ${right+S(10)+J()} ${bot-S(172)+J()}`

/* a US work van in marker line art, reused as the wedge signal and as "the real part".
   Unibody cargo-van profile (Transit-class): continuous roofline into the cab, short
   raked hood, ladder rack with a ladder up top, tow mirror, rear step bumper. The
   chassis line arcs OVER each wheel (wheel wells cut into the body); tires touch the
   ground at y + 140*sc, same contract as before. Shadow (filled state) is a flat drawn
   ellipse — same rendering language as the ink, no blur. Wobble is seeded + boils. */
function vanArt(x,y,sc,p,filled){
  if(p<=0&&!filled) return '';
  const g=[], S=v=>v*sc, q=v=>clamp(p*2.8-v,0,1), qf=v=>clamp(p*7-v,0,1);
  const arcp=(cx,cy,r,a0,a1,n)=>{const o=[];for(let i=0;i<=n;i++){
    const a=(a0+(a1-a0)*i/n)*Math.PI/180;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return o;};
  const densify=pts=>{const o=[];for(let i=0;i<pts.length;i++){o.push(pts[i]);
    if(i<pts.length-1){const a=pts[i],b=pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.floor(L/34);
      for(let k=1;k<=n;k++)o.push([a[0]+(b[0]-a[0])*k/(n+1),a[1]+(b[1]-a[1])*k/(n+1)]);}}return o;};
  const wob=(pts,seed,amp,close)=>{const r=rnd(seed+boil()),j=()=>(r()-0.5)*2*amp*sc;let d='';
    densify(pts).forEach((pt,i)=>{d+=`${i?' L':'M'} ${(x+S(pt[0])+j()).toFixed(2)} ${(y+S(pt[1])+j()).toFixed(2)}`;});
    return close?d+' Z':d;};
  const flat=pts=>{let d='';pts.forEach((pt,i)=>{
    d+=`${i?' L':'M'} ${(x+S(pt[0])).toFixed(2)} ${(y+S(pt[1])).toFixed(2)}`;});return d+' Z';};

  /* geometry, unscaled: ground at v=140, nose at u=359, ladder overhangs the tail */
  const SIL=[[12,112],[7,104],[6,26],[9,14],[24,8],[254,8],[264,11],[302,54],[311,57],
             [340,59],[350,63],[357,71],[359,92],[357,104],[350,112],[326,112],
             ...arcp(288,110,38,3.0,-183.0,10),[122,112],...arcp(84,110,38,3.0,-183.0,10)];
  const WSH=[[258,16],[268,16],[300,52],[290,52]], DWIN=[[232,18],[257,18],[284,48],[232,48]];
  const MARM=[[283,31],[307,32]], MIR=[[305,24],[318,25],[317,45],[304,44]];
  const HLT=[[342,62],[355,65],[355,73],[342,70]];
  const FBP=[[338,102],[357,102],[357,107],[350,112],[338,112]], RBP=[[-2,102],[14,102],[14,115],[-2,115]];
  const PAN=[[42,22],[198,22],[198,66],[42,66]];
  const tire=c=>arcp(c,111,29,-90,270,14), hub=c=>arcp(c,111,11.5,-90,270,10);
  const RW=84, FW=288;
  const multi=(segs,seed,amp)=>{const r=rnd(seed+boil()),j=()=>(r()-0.5)*2*amp*sc;let d='';
    segs.forEach(s2=>{d+=`M ${(x+S(s2[0])+j()).toFixed(2)} ${(y+S(s2[1])+j()).toFixed(2)}`
                       +` L ${(x+S(s2[2])+j()).toFixed(2)} ${(y+S(s2[3])+j()).toFixed(2)} `;});return d;};
  const rungSegs=[];for(let u=0;u<=300;u+=25)rungSegs.push([u,-7.5,u,0.5]);

  if(filled){
    g.push(`<ellipse cx="${(x+S(172)).toFixed(1)}" cy="${(y+S(140)).toFixed(1)}" rx="${S(176).toFixed(1)}" ry="${S(6).toFixed(1)}" fill="${INK}" opacity="0.16"/>`);
    g.push(F(flat(RBP),{fill:'#4A4845'}));
    g.push(F(flat(SIL),{fill:'#DCD7CE'}));
    g.push(F(flat(FBP),{fill:'#4A4845'}));
    g.push(F(flat(WSH),{fill:'#8C99A4'})); g.push(F(flat(DWIN),{fill:'#8C99A4'}));
    g.push(F(flat(MIR),{fill:'#4A4845'})); g.push(F(flat(HLT),{fill:'#E8E4DC'}));
    g.push(F(flat(tire(RW)),{fill:PLATE})); g.push(F(flat(tire(FW)),{fill:PLATE}));
    g.push(F(flat(hub(RW)),{fill:'#8C8A85'})); g.push(F(flat(hub(FW)),{fill:'#8C8A85'}));
    g.push(F(flat(PAN),{fill:'#F2EFE8'}));
  }
  /* ink — silhouette first, then glass + door, wheels, front gear, rack + ladder, panel */
  g.push(P(wob(SIL,7301,2.2,true), q(0),{w:S(5)}));
  g.push(P(wob([[230,18],[230,106]],7302,1.8), q(0.7),{w:S(4)}));
  g.push(P(wob(WSH,7303,1.4,true), q(0.8),{w:S(4),opacity:.9}));
  g.push(P(wob(DWIN,7304,1.4,true), q(0.9),{w:S(4),opacity:.9}));
  g.push(P(wob([[239,55],[250,55]],7305,1), q(0.95),{w:S(4)}));
  g.push(P(wob(tire(RW),7306,1.8,true), q(1.0),{w:S(5)}));
  g.push(P(wob(tire(FW),7307,1.8,true), q(1.15),{w:S(5)}));
  g.push(P(wob(hub(RW),7308,1.2,true), q(1.3),{w:S(3.5),opacity:.85}));
  g.push(P(wob(hub(FW),7309,1.2,true), q(1.3),{w:S(3.5),opacity:.85}));
  g.push(P(wob(MARM,7310,1), q(1.25),{w:S(4)}));
  g.push(P(wob(MIR,7311,1.2,true), q(1.25),{w:S(4)}));
  g.push(P(wob(HLT,7312,1.2,true), q(1.3),{w:S(4),opacity:.9}));
  g.push(P(wob(FBP,7313,1.4,true), q(1.35),{w:S(4)}));
  g.push(P(wob(RBP,7314,1.4,true), q(1.35),{w:S(4)}));
  g.push(P(wob([[10,30],[10,48]],7316,1), q(1.4),{w:S(4),opacity:.85}));
  g.push(P(wob([[-16,1],[308,1]],7318,1.6), q(1.4),{w:S(4)}));
  g.push(P(wob([[-16,-8],[308,-8]],7319,1.6), q(1.45),{w:S(4)}));
  g.push(P(multi([[56,8,56,1.5],[158,8,158,1.5],[252,8,252,1.5]],7317,1.2), qf(3.6),{w:S(4)}));
  g.push(P(multi(rungSegs,7320,1.2), qf(5.6),{w:S(3.5),opacity:.9}));
  g.push(P(wob(PAN,7315,1.4,true), filled?1:q(1.7),
           {stroke:filled?ACCENT:INK, w:filled?S(5):S(4), opacity:filled?1:.8}));
  return g.join('');
}

function r3gridCells(t,f,opts){
  const o=[], SNAP=210;
  const snapped = f>=SNAP || opts.finished;
  for(let i=0;i<4;i++){
    const [x,y]=RC[i];
    if(snapped){
      let cell = adFinal(x,y,RW3,RH3,i);
      if(opts.dimLosers && i!==0) cell = grp(cell,null,0.30);
      if(f>=SNAP && f<SNAP+5 && !opts.finished){
        const k=clamp((f-SNAP)/4,0,1), sc2=1+0.030*(1-easeOut(k));
        const cx=x+RW3/2, cy=y+RH3/2;
        cell = grp(cell, `translate(${cx} ${cy}) scale(${sc2.toFixed(5)}) translate(${-cx} ${-cy})`);
      }
      o.push(cell);
    } else {
      const sk=seg(t,4.8+i*0.4,6.4+i*0.4);
      if(sk>0) o.push(adSketch(x,y,RW3,RH3,i,sk,9200+i));
    }
  }
  /* accent brackets: rows = concepts, columns = hooks, co-timed with the claim */
  const bp=seg(t, opts.finished?-2:5.2, opts.finished?-1:7.0);
  if(bp>0 && !opts.noBrackets){
    o.push(P(wline(656,215,656,510,9301), clamp(bp*2,0,1), {stroke:ACCENT,w:6,opacity:.8}));
    o.push(P(wline(656,555,656,850,9302), clamp(bp*2,0,1), {stroke:ACCENT,w:6,opacity:.8}));
    o.push(P(wline(680,192,1170,192,9303), clamp(bp*2-0.6,0,1), {stroke:ACCENT,w:6,opacity:.8}));
    o.push(P(wline(1260,192,1750,192,9304), clamp(bp*2-0.6,0,1), {stroke:ACCENT,w:6,opacity:.8}));
  }
  return o.join('');
}
/* mini finished ad inside a phone screen (SOURCE state), with a play bar */
function r3sourceScreen(o2,t){
  if(!o2.__ix) return '';
  const ix=o2.__ix, iy=o2.__iy, iw=o2.__iw, ih=o2.__ih;
  const aw=iw*0.86, ah=aw*9/16, ax=ix+(iw-aw)/2, ay=iy+ih*0.30;
  const barP = t<10 ? (1.1+t)/10.1 : seg(t,58.9,60.0)*1.1/10.1;
  return grp(
    adFinal(ax,ay,aw,ah,0)
    + F(rectD(ax,ay+ah+8,aw,5),{fill:'#B5B0A6'})
    + F(rectD(ax,ay+ah+8,aw*clamp(barP,0,1),5),{fill:ACCENT}), null, 1);
}

/* B1 0-9 : the grid, already being made */
function r1(t,f){
  const o=[];
  const outline = (t<1.2) ? 0.55 + 0.45*seg(t,0,1.2) : 1;
  o.push(r3gridOutline(outline));
  o.push(r3gridCells(t,f,{}));
  const h={screen:'source', draw:1, tilt:-4};
  o.push(grp(handPhone(1794,800,0.56,h)));
  o.push(grp(r3sourceScreen(h,t), `rotate(-4 1794 800)`));
  return o.join('');
}
/* B2 9-15 : the quiet phone + the lonely ad */
function r2b(t){
  const o=[];
  const h={screen:'dark', draw:seg(t,9.2,10.4), tilt:-6};
  o.push(grp(handPhone(430,650,0.85,h)));
  o.push(adSketch(1000,330,640,360,1,seg(t,9.8,12.0),9401));
  return o.join('');
}
/* B3 15-23 : the filming phone, jobsite inside the screen */
function r3b(t){
  const o=[];
  const h={screen:'film', plainFilm:true, draw:seg(t,15.0,16.4), tilt:7};
  const inner=[];
  o.push(grp(handPhone(1050,520,1.02,h)));
  if(h.__ix){
    const ix=h.__ix, iy=h.__iy, iw=h.__iw, ih=h.__ih, hz=iy+ih*0.60;
    const p=seg(t,16.6,19.0);
    inner.push(grp(vanArt(ix+iw*0.06, hz-ih*0.001-140*0.20, 0.20, p, false)));
    inner.push(shopArt(ix+iw*0.62, hz, 0.30, clamp(p*1.4-0.4,0,1), false));
    const ap=seg(t,20.0,21.0);
    if(ap>0){
      inner.push(P(`M ${ix+iw*0.72} ${hz+ih*0.16} C ${ix+iw*0.55} ${hz+ih*0.26}, ${ix+iw*0.38} ${hz+ih*0.26}, ${ix+iw*0.24} ${hz+ih*0.18}`, ap,{stroke:ACCENT,w:5}));
      inner.push(P(`M ${ix+iw*0.30} ${hz+ih*0.135} L ${ix+iw*0.235} ${hz+ih*0.183} L ${ix+iw*0.31} ${hz+ih*0.225}`, clamp(ap*3-2,0,1),{stroke:ACCENT,w:5}));
    }
    o.push(inner.join(''));
  }
  return o.join('');
}
/* B4 23-30 : the clip becomes the board; env snaps, the van keeps its ink */
const R4_HZ=770;
function r4b(t,f){
  const o=[], SNAP=822;
  const snapped=f>=SNAP;
  const gp = easeOut(seg(t,23.0,24.0));      /* the clip growing out of the phone */
  const g=[];
  if(snapped){
    g.push(F(rectD(0,0,W,R4_HZ),{fill:'url(#skyGrad)'}));
    g.push(F(rectD(0,R4_HZ,W,H-R4_HZ),{fill:'#565450'}));
  } else {
    g.push(P(wline(60,R4_HZ,1860,R4_HZ,9501), seg(t,23.2,24.0),{w:5,opacity:.85}));
    g.push(P(wline(140,200,520,200,9502), seg(t,24.2,24.8),{w:4,opacity:.5}));
    g.push(P(wline(1450,160,1810,160,9503), seg(t,24.4,25.0),{w:4,opacity:.5}));
  }
  g.push(shopArt(1400,R4_HZ,1.15,seg(t,24.6,26.2),snapped));
  g.push(vanArt(700,R4_HZ-140*1.30,1.30,seg(t,23.8,25.6),snapped));
  const cx=960, cy=540, sc0=0.24;
  const tf = gp<1 ? `translate(${(1050+ (cx-1050)*gp).toFixed(1)} ${(520+(cy-520)*gp).toFixed(1)}) scale(${(sc0+(1-sc0)*gp).toFixed(4)}) translate(${-cx} ${-cy})` : null;
  return grp(g.join(''), tf);
}
/* B5 30-38.5 : the winner circled, the turnaround held */
function r5b(t,f){
  const o=[];
  const slide = lerp(-W,0,easeIO(seg(t,30.0,30.5)));
  const g=[];
  g.push(r3gridOutline(1));
  g.push(r3gridCells(t,f,{finished:true, dimLosers:t>=31.4, noBrackets:true}));
  const cp=seg(t,30.3,31.1);
  if(cp>0){
    const cx=RC[0][0]+RW3/2, cy=RC[0][1]+RH3/2;
    g.push(P(`M ${cx+RW3*0.58} ${cy} C ${cx+RW3*0.58} ${cy-RH3*0.72}, ${cx-RW3*0.60} ${cy-RH3*0.74}, ${cx-RW3*0.62} ${cy}`
           +` C ${cx-RW3*0.63} ${cy+RH3*0.74}, ${cx+RW3*0.56} ${cy+RH3*0.76}, ${cx+RW3*0.58} ${cy+RH3*0.06}`, cp,{stroke:ACCENT,w:7}));
  }
  const tk=seg(t,31.6,32.1);
  if(tk>0) g.push(P(`M ${RC[0][0]-58} ${RC[0][1]+150} L ${RC[0][0]-38} ${RC[0][1]+174} L ${RC[0][0]-6} ${RC[0][1]+126}`, tk,{stroke:ACCENT,w:8}));
  const up=seg(t,34.4,36.0);
  if(up>0) g.push(P(wline(110,352,110+560*up,352,9601), 1,{stroke:ACCENT,w:6,opacity:.85}));
  return grp(g.join(''), `translate(${slide.toFixed(1)} 0)`);
}
/* B6 38.5-45.5 : the labelled triple, each tick proven on the ad */
function r6b(t){
  const o=[], AX=140, AY=300, AW=760, AH=428, SV3=1;
  const ap=seg(t,38.5,39.0);
  if(ap>0) o.push(grp(adFinal(AX,AY,AW,AH,SV3),null,ap));
  o.push(P(wline(1150,320,1150,560,9701), seg(t,38.6,39.0),{w:5,opacity:.55}));
  o.push(tick(1160,346,seg(t,38.9,39.2)));
  o.push(tick(1160,432,seg(t,40.3,40.6)));
  o.push(tick(1160,518,seg(t,41.7,42.0)));
  const a1=seg(t,38.9,39.2);
  if(a1>0){ const x=AX+28,y=AY+26;
    o.push(grp(F(rectD(x,y,220,42),{fill:'#F2EFE8',opacity:.95})+F(rectD(x+16,y+14,126,7),{fill:'#3A3A3A'})+F(rectD(x+152,y+14,50,7),{fill:ACCENT}),null,a1)); }
  const a2=seg(t,40.3,40.6);
  if(a2>0){ const x=AX+54,y=AY+AH-156;
    o.push(grp(P(`M ${x} ${y} q 0 -38 34 -44 M ${x+56} ${y} q 0 -38 34 -44`,1,{stroke:'#F2EFE8',w:9,opacity:.85}),null,a2));
    o.push(P(wline(x-18,y-56,x+110,y+18,9702), a2,{stroke:ACCENT,w:8})); }
  const a3=seg(t,41.7,42.2);
  if(a3>0){ const rx=AX+VAR[1].cap[0]*AW+24, ry=AY+AH-22;
    o.push(P(wline(rx,ry,rx+AW*0.26,ry,9703), a3,{stroke:ACCENT,w:7})); }
  const cc=seg(t,44.2,45.0);
  if(cc>0) o.push(P(`M 1740 300 C 1806 420, 1788 560, 1560 592 C 1300 626, 1120 596, 1108 452 C 1098 330, 1300 296, 1520 300 C 1610 302, 1690 296, 1736 312`, cc,{stroke:ACCENT,w:6,opacity:.8}));
  return o.join('');
}
/* B7 45.5-53 : the viewer's ad, drawn fresh, snapped, shown on the phone */
const R7F={x:560,y:190,w:1000,h:563}, R7HZ=190+470;
function r7b(t,f){
  const o=[], SNAP=1464;
  o.push(P(wobbleRect(R7F.x,R7F.y,R7F.w,R7F.h,9801,3), seg(t,45.5,46.3),{w:6}));
  const snapped=f>=SNAP;
  const g=[];
  if(snapped){
    g.push(F(rectD(R7F.x+4,R7F.y+4,R7F.w-8,R7HZ-R7F.y-4),{fill:'url(#skyGrad)'}));
    g.push(F(rectD(R7F.x+4,R7HZ,R7F.w-8,R7F.y+R7F.h-R7HZ-4),{fill:'#565450'}));
  } else {
    g.push(P(wline(R7F.x+30,R7HZ,R7F.x+R7F.w-30,R7HZ,9802), seg(t,46.4,47.0),{w:4,opacity:.8}));
  }
  g.push(vanArt(R7F.x+120, R7HZ-140*0.95, 0.95, seg(t,46.6,48.2), snapped));
  g.push(shopArt(R7F.x+660, R7HZ, 0.85, seg(t,47.2,48.4), snapped));
  if(snapped && f<SNAP+5){
    const k=clamp((f-SNAP)/4,0,1), sc2=1+0.030*(1-easeOut(k));
    const cx=R7F.x+R7F.w/2, cy=R7F.y+R7F.h/2;
    o.push(grp(g.join(''), `translate(${cx} ${cy}) scale(${sc2.toFixed(5)}) translate(${-cx} ${-cy})`));
  } else o.push(g.join(''));
  if(t>=49.4){
    const h={screen:'source', draw:seg(t,49.4,50.4), tilt:-4};
    o.push(grp(handPhone(1760,830,0.46,h)));
    o.push(grp(r3sourceScreen(h,t), `rotate(-4 1760 830)`));
  }
  return o.join('');
}
/* B8 53-60 : endcard, then the promise performed (the seam) */
function r8b(t,f){
  const o=[];
  const rec = easeIO(seg(t,53.0,53.8));
  if(t<55.0){
    const sc2=lerp(1,0.30,rec), cx=960, cy=470;
    o.push(grp(
      P(wobbleRect(R7F.x,R7F.y,R7F.w,R7F.h,9801,3),1,{w:6})
      + F(rectD(R7F.x+4,R7F.y+4,R7F.w-8,R7HZ-R7F.y-4),{fill:'url(#skyGrad)'})
      + F(rectD(R7F.x+4,R7HZ,R7F.w-8,R7F.y+R7F.h-R7HZ-4),{fill:'#565450'})
      + vanArt(R7F.x+120,R7HZ-140*0.95,0.95,1,true) + shopArt(R7F.x+660,R7HZ,0.85,1,true),
      `translate(${lerp(0,-620,rec).toFixed(1)} ${lerp(0,-190,rec).toFixed(1)}) translate(${cx} ${cy}) scale(${sc2.toFixed(4)}) translate(${-cx} ${-cy})`,
      1-seg(t,54.2,55.0)));
  }
  const up=seg(t,53.6,54.2);
  if(up>0 && t<58.6) o.push(P(wline(700,470,700+520*up,470,9901), 1,{stroke:ACCENT,w:9,opacity:1-seg(t,58.5,58.6)}));
  /* seam restart: the marker begins the next grid while the hand re-enters */
  if(t>=58.9){
    o.push(r3gridOutline(0.55*seg(t,58.9,60.0)));
    const ent=easeOut(seg(t,58.9,60.0));
    const hx=1794+(1-ent)*260, hy=800+(1-ent)*300;
    const h={screen:'source', draw:1, tilt:-4};
    o.push(grp(handPhone(hx, hy, 0.56, h)));
    o.push(grp(r3sourceScreen(h,t), `rotate(-4 ${hx.toFixed(1)} ${hy.toFixed(1)})`));
  }
  return o.join('');
}

function renderArtRev3(t,f){
  const o=[];
  if(t<9.6)               o.push(grp(r1(t,f),  `translate(${wipe(t,9.0,9.6)} 0)`));
  if(t>=9.0  && t<15.4)   o.push(grp(r2b(t),   `translate(${wipe(t,14.9,15.4)} 0)`));
  if(t>=15.0 && t<23.0)   o.push(grp(r3b(t),   null, 1-seg(t,22.6,23.0)));
  if(t>=23.0 && t<30.4)   o.push(grp(r4b(t,f), `translate(${wipe(t,29.9,30.4)} 0)`));
  if(t>=30.0 && t<38.9)   o.push(grp(r5b(t,f), null, 1-seg(t,38.5,38.9)));
  if(t>=38.5 && t<45.9)   o.push(grp(r6b(t),   null, 1-seg(t,45.5,45.9)));
  if(t>=45.5 && t<53.0)   o.push(r7b(t,f));
  if(t>=53.0)             o.push(r8b(t,f));
  o.push(r3marks(t));
  return o.join('');
}

/* =====================================================================
   FRAME ASSEMBLY
   ===================================================================== */
function wipe(t,a,b){ return -W*easeIO(seg(t,a,b)); }   /* board clears left */

function renderArt(t,f){
  const o=[];
  if(t<7.6)                 o.push(grp(s1(t),  `translate(${wipe(t,7.0,7.6)} 0)`));
  if(t>=7.0  && t<15.6)     o.push(grp(s2(t),  `translate(${wipe(t,15.0,15.6)} 0)`));
  if(t>=15.0 && t<26.5)     o.push(grp(s34(t,f),`translate(${wipe(t,26.0,26.5)} 0)`));
  if(t>=26.0 && t<37.0)     o.push(grp(s56(t), `translate(${wipe(t,36.5,37.0)} 0)`));
  if(t>=36.5 && t<45.0)     o.push(grp(s7(t),  `translate(${wipe(t,44.5,45.0)} 0)`));
  if(t>=44.5 && t<53.0)     o.push(grp(s8(t),  `translate(${wipe(t,52.5,53.0)} 0)`));
  if(t>=52.5 && t<57.5)     o.push(grp(s9(t,f),null, 1-seg(t,57.2,57.45)));
  if(t>=57.2)               o.push(s10(t));
  return o.join('');
}

function renderText(t){
  const o=[];
  for(const T of (CUT==='rev3'?TEXTS_R3:CUT==='challenger'?TEXTS_CH:TEXTS)){
    let a=0;
    if(t>=T.in-FADE && t<=T.out+FADE){
      a = Math.min(seg(t,T.in-FADE,T.in), 1-seg(t,T.out,T.out+FADE));
    }
    if(a<=0.001) continue;
    const dy = lerp(10,0,easeOut(seg(t,T.in-FADE,T.in+0.10)));
    const left = T.a==='c' ? T.x : T.x;
    const tf = T.a==='c' ? 'translate(-50%,-50%)' : 'translate(0,-50%)';
    o.push(`<div class="t ${T.a} ${T.cls||''}" style="left:${left}px;top:${(T.y+dy).toFixed(2)}px;`
         + `width:${T.w}px;font-size:${T.sz}px;opacity:${a.toFixed(4)};`
         + `transform:${tf}${T.a==='c'?'':''};${T.a==='c'?`margin-left:${-T.w/2}px;transform:translate(0,-50%);`:''}">`
         + T.s.replace(/&/g,'&amp;').replace(/</g,'&lt;') + `</div>`);
  }
  return o.join('');
}

function render(f){
  f = clamp(Math.round(f),0,TOTAL-1);
  CURF = f;
  const t = f/FPS;
  document.getElementById('scene').innerHTML = (CUT==='rev3') ? renderArtRev3(t,f) : (CUT==='challenger') ? renderArtChallenger(t,f) : renderArt(t,f);
  document.getElementById('txt').innerHTML   = renderText(t);
  document.title = 'f'+f+' t'+t.toFixed(3);
  window.__frame = f;
  return f;
}
window.setFrame = render;

/* contrast reporting — printed, never asserted */
function lum(hex){
  const c=[1,3,5].map(i=>parseInt(hex.substr(i,2),16)/255)
    .map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
}
function ratio(a,b){const l1=lum(a),l2=lum(b);const [x,y]=l1>l2?[l1,l2]:[l2,l1];return (x+0.05)/(y+0.05);}
window.__contrast = {
  'ink_on_ground'   : +ratio(INK,GROUND).toFixed(2),
  'accent_on_ground': +ratio(ACCENT,GROUND).toFixed(2),
  'light_on_plate'  : +ratio(LIGHT,PLATE).toFixed(2)
};

const q = new URLSearchParams(location.search);
render(parseInt(q.get('frame')||'0',10));
</script>

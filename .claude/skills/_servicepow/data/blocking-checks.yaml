# CANONICAL BLOCKING-CHECK REGISTRY — the ONLY home of the delivery-gate list.
# The count is DERIVED (scripts/validate.py). No prose anywhere may state it.
# Format: strict subset (list of flat mappings, single-line double-quoted scalars)
# parsed by scripts/validate.py without external dependencies.
# applies: which deliverable type/motion the check binds (any-deliverable | client-facing |
#   ad | generated-media | generated-visual | any-visual | generation | video-master |
#   video-storyboard | video-people | outbound). A check whose applies does not match the
#   deliverable is recorded N/A at readiness — it is NOT a block (Run 12 applicability law).
# owner values: machine-harness | source-qc | enforcement-qc | performance-qc | biomech-qc |
#               compliance | human-judgement | storyboard-gate
# testability: machine | human | hybrid
# Lineage: imported 2026-09-01 from the ratified v4.0-consolidation list
# (Kobe playbook, decision 0005), roles substituted per data/roles.md.

checks:
  - id: "BC-01"
    name: "Resolution"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "Master resolution matches the declared placement spec."
    testability: "machine"
    source: "qc harness --master"
  - id: "BC-02"
    name: "FPS"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "Frame rate matches the declared spec."
    testability: "machine"
    source: "qc harness --master"
  - id: "BC-03"
    name: "Pixel format"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "Pixel format is delivery-legal for the platform."
    testability: "machine"
    source: "qc harness --master"
  - id: "BC-04"
    name: "Audio present, 48k stereo"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "Audio track present at 48kHz stereo."
    testability: "machine"
    source: "qc harness --master"
  - id: "BC-05"
    name: "Loudness (LUFS)"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "Integrated loudness within the declared LUFS target."
    testability: "machine"
    source: "qc harness --master"
  - id: "BC-06"
    name: "No frozen sections"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "No section of the master is frozen (near-zero edge travel)."
    testability: "machine"
    source: "qc harness --master"
  - id: "BC-07"
    name: "No black sections"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "No unintended black sections in the master."
    testability: "machine"
    source: "qc harness --master"
  - id: "BC-08"
    name: "Clip motion gate (slow-mo)"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "Every clip passes the measured motion floor; no unintended slow motion."
    testability: "machine"
    source: "qc harness --gate-clips"
  - id: "BC-09"
    name: "Master per-shot slow-mo"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "Per-shot motion measured on the assembled master; no shot below floor."
    testability: "machine"
    source: "qc harness --master"
  - id: "BC-10"
    name: "No flash cuts"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "No cuts shorter than the flash-cut floor."
    testability: "machine"
    source: "qc harness --master"
  - id: "BC-11"
    name: "Aspect declared and matched"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "Aspect ratio declared up front and matched by the master."
    testability: "machine"
    source: "qc harness --master"
  - id: "BC-12"
    name: "Duration declared and matched"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "Duration declared up front and matched by the master."
    testability: "machine"
    source: "qc harness --master"
  - id: "BC-13"
    name: "No letterbox/pillarbox"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "No letterboxing or pillarboxing on the delivered master."
    testability: "machine"
    source: "qc harness --master"
  - id: "BC-14"
    name: "Opening dead-space"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "No dead opening; motion/energy present from frame 1."
    testability: "machine"
    source: "qc harness --master"
  - id: "BC-15"
    name: "Expected strings on screen"
    owner: "machine-harness"
    severity: "blocking"
    applies: "video-master"
    description: "Declared on-screen strings (phone, URL, offer) verified present (--expect)."
    testability: "machine"
    source: "qc harness --expect"
  - id: "BC-16"
    name: "Every claim substantiated"
    owner: "compliance"
    severity: "blocking"
    applies: "any-deliverable"
    description: "Every claim cites a filed Evidence Record (EV-id) or is absent."
    testability: "hybrid"
    source: "policies/claims-and-proof.md"
  - id: "BC-17"
    name: "No synthetic person as customer"
    owner: "compliance"
    severity: "blocking"
    applies: "generated-media"
    description: "No synthetic testimonial; no AI person presented as a real customer, reviewer, or endorser."
    testability: "human"
    source: "policies/realism-and-disclosure.md"
  - id: "BC-18"
    name: "Platform AI disclosure set"
    owner: "compliance"
    severity: "blocking"
    applies: "generated-media"
    description: "AI/synthetic-content disclosure set on every destination where required."
    testability: "human"
    source: "policies/realism-and-disclosure.md"
  - id: "BC-19"
    name: "Ad-to-landing-page parity"
    owner: "compliance"
    severity: "blocking"
    applies: "ad"
    description: "Destination actually opened and confirmed to deliver what the ad promises."
    testability: "human"
    source: "policies/claims-and-proof.md"
  - id: "BC-20"
    name: "Rights cleared"
    owner: "compliance"
    severity: "blocking"
    applies: "any-deliverable"
    description: "Music, footage, likeness, and logos rights confirmed."
    testability: "human"
    source: "policies/claims-and-proof.md"
  - id: "BC-21"
    name: "Correct client, correct brand assets"
    owner: "human-judgement"
    severity: "blocking"
    applies: "any-deliverable"
    description: "Deliverable is for the right client and uses their real approved assets."
    testability: "human"
    source: "policies/brand-assets.md"
  - id: "BC-22"
    name: "Client-ready score floor"
    owner: "human-judgement"
    severity: "blocking"
    applies: "client-facing"
    description: "ServicePow-6 overall at/above floor with no axis below its floor (servicepow-creative-critic owns the scorecard)."
    testability: "human"
    source: "skills/servicepow-creative-critic"
  - id: "BC-23"
    name: "Skeptic verdict"
    owner: "human-judgement"
    severity: "blocking"
    applies: "client-facing"
    description: "Skeptic verdict is PASS, or a CONDITIONAL explicitly accepted by the APPROVER. A SKEPTIC VOID is a block."
    testability: "hybrid"
    source: "skills/servicepow-skeptic"
  - id: "BC-24"
    name: "Angle declared and rotated; Anti-Generic Gate"
    owner: "human-judgement"
    severity: "blocking"
    applies: "ad"
    description: "Angle declared and rotated against ad history (excerpt pasted); logo-swap and memory tests passed."
    testability: "human"
    source: "skills/servicepow-creative-director"
  - id: "BC-25"
    name: "A human watched it end to end"
    owner: "human-judgement"
    severity: "blocking"
    applies: "video-master"
    description: "A human actually watched the delivered master end to end."
    testability: "human"
    source: "policies/realism-and-disclosure.md"
  - id: "BC-26"
    name: "Audio beds ASR-verified speech-free"
    owner: "source-qc"
    severity: "blocking"
    applies: "video-master"
    description: "Any audio to be looped or layered is ASR-verified speech-free before use (--bed)."
    testability: "machine"
    source: "source qc --bed"
  - id: "BC-27"
    name: "Master speech matches declared lines"
    owner: "source-qc"
    severity: "blocking"
    applies: "video-master"
    description: "Finished master's speech matches declared lines exactly once each, with no undeclared speech (--master --expect-line)."
    testability: "machine"
    source: "source qc --master --expect-line"
  - id: "BC-28"
    name: "Burned text in safe area"
    owner: "source-qc"
    severity: "blocking"
    applies: "video-master"
    description: "All burned text inside the platform safe area, 15-70 percent of frame height (--safe-area)."
    testability: "machine"
    source: "source qc --safe-area"
  - id: "BC-29"
    name: "Preflight passed before generation"
    owner: "enforcement-qc"
    severity: "blocking"
    applies: "generation"
    description: "--preflight passed and pasted before any generation; a gate that cannot run is a BLOCK."
    testability: "machine"
    source: "qc harness --preflight"
  - id: "BC-30"
    name: "Every clip gated by md5-matched PASS"
    owner: "enforcement-qc"
    severity: "blocking"
    applies: "video-master"
    description: "--gate-clips exit 0 for every clip in the edit, each matched to a PASS by md5; INDETERMINATE requires a named human acceptance."
    testability: "machine"
    source: "qc harness --gate-clips"
  - id: "BC-31"
    name: "Motion axis named per shot"
    owner: "enforcement-qc"
    severity: "blocking"
    applies: "video-storyboard"
    description: "Every shot names a motion axis at storyboard; no delivered shot below the motion floor without named acceptance."
    testability: "hybrid"
    source: "skills/servicepow-storyboard-director"
  - id: "BC-32"
    name: "Performance gate (speech pacing)"
    owner: "performance-qc"
    severity: "blocking"
    applies: "video-people"
    description: "No line above the WPM ceiling; rhythm ratio, breath, slow anchor, and price/offer/CTA pacing within the gate's thresholds."
    testability: "machine"
    source: "performance qc"
  - id: "BC-33"
    name: "Impossible-human-speed gate"
    owner: "biomech-qc"
    severity: "blocking"
    applies: "video-people"
    description: "No shot fails the biomechanics gate; OSCILLATION blocks; VELOCITY/BURST warnings need named human acceptance."
    testability: "machine"
    source: "biomech qc"
  - id: "BC-34"
    name: "Real reference cited per scene"
    owner: "storyboard-gate"
    severity: "blocking"
    applies: "video-storyboard"
    description: "Every scene with a findable real reference carries it, cited, in the storyboard's tenth field; otherwise NO REFERENCE FOUND - HIGH RISK is surfaced to the APPROVER with the scene named. Enforced at the storyboard gate, before a keyframe exists; not machine-checkable and not pretended to be."
    testability: "human"
    source: "skills/servicepow-storyboard-director"
  - id: "BC-35"
    name: "Outbound execution gate"
    owner: "human-judgement"
    severity: "blocking"
    applies: "outbound"
    description: "No action that initiates outreach executes without APPROVER sign-off of the approval packet. Covers email send, SMS send, calling or dialing, DM send, list purchase, paid enrichment, campaign activation, bulk upload to a sending platform, and any API write that initiates outreach."
    testability: "human"
    source: "skills/servicepow-outbound-director"
  - id: "BC-36"
    name: "Approval packet completeness"
    owner: "enforcement-qc"
    severity: "blocking"
    applies: "outbound"
    description: "The packet presented to the APPROVER carries every required field; a packet missing any field is not a packet and cannot be signed off."
    testability: "machine"
    source: "skills/servicepow-outbound-director"
  - id: "BC-37"
    name: "Suppression checked before send"
    owner: "compliance"
    severity: "blocking"
    applies: "outbound"
    description: "Every recipient is checked against the suppression list at qualification and again immediately before send. Suppression entries are permanent and never re-mailed."
    testability: "machine"
    source: "skills/servicepow-outbound-director"
  - id: "BC-38"
    name: "Outbound claim evidence"
    owner: "compliance"
    severity: "blocking"
    applies: "outbound"
    description: "Every material claim about Service Pow in outbound copy cites a valid Evidence Record id. With no valid record the claim is omitted or rewritten as non-claim positioning, never softened."
    testability: "hybrid"
    source: "skills/servicepow-outbound-director"
  - id: "BC-39"
    name: "Consent and channel legality"
    owner: "compliance"
    severity: "blocking"
    applies: "outbound"
    description: "Each channel touch meets its consent tier, quiet hours and do-not-call rules before it is planned. Cold marketing SMS without prior express written consent is blocked at planning, not at send."
    testability: "hybrid"
    source: "skills/servicepow-outbound-director"
  - id: "BC-40"
    name: "Volume within capacity ceiling"
    owner: "enforcement-qc"
    severity: "blocking"
    applies: "outbound"
    description: "Planned volume never exceeds the ceiling derived from the recorded capacity input. An absent capacity input is an unknown that blocks the run; it is never replaced with an assumed number."
    testability: "machine"
    source: "skills/servicepow-outbound-director"
  - id: "BC-41"
    name: "Physical and trade realism"
    owner: "human-judgement"
    severity: "blocking"
    applies: "generated-visual"
    description: "Every generated asset and the assembled master pass the QA2 checklist: correct tool and usage for the specific operation shown, mechanically possible systems, sound physics (no water inside opaque metal, no unexplained openings), sound anatomy and motion, no floating or morphing objects, no AI-tell staging, continuity intact. Beautiful but technically wrong fails. Judged per operation, never overfitted to a prior example."
    testability: "human"
    source: "skills/servicepow-video-production"
  - id: "BC-42"
    name: "Composited text discipline"
    owner: "enforcement-qc"
    severity: "blocking"
    applies: "any-visual"
    description: "Any text a viewer must read - numbers, offers, disclosures, captions, screen UI - is composited from real glyphs or real supplied assets, never model-rendered. Model-painted incidental text in scene backgrounds must be illegible-irrelevant or the shot is rejected."
    testability: "hybrid"
    source: "skills/servicepow-video-production"
  - id: "BC-43"
    name: "Preflight before generation spend"
    owner: "enforcement-qc"
    severity: "blocking"
    applies: "generation"
    description: "No paid generation request is issued until preflight passes: toolchain present, delivery path proven, the chosen model can reach the QC floors it will be graded against, prompts clear the motion floor, and any voice route is proven by produced audio. A failed preflight blocks spend, not quality at the gate."
    testability: "machine"
    source: "skills/servicepow-video-production"

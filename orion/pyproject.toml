[project]
name = "orion"
version = "0.1.0"
description = "Voice-first assistant for Service Pow"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx",
]

[project.optional-dependencies]
# Audio is only needed for Tier 3 (/voice). The text path works without it,
# which keeps `uv sync` usable on a machine with no working audio stack.
voice = [
    "sounddevice>=0.4",
    "websockets>=13",
]
dev = [
    "pytest>=8.0",
]

# Default groups: plain `uv sync` (with or without --extra voice) installs these, so
# an exact sync never silently uninstalls the test runner or the coding-job SDK.
[dependency-groups]
dev = ["pytest>=8.0"]
# delegate_coding_task (bundles the Claude Code runtime).
coder = ["claude-agent-sdk>=0.2"]

[tool.uv]
default-groups = ["dev", "coder"]

[project.scripts]
orion = "orion.cli:main"
orion-heartbeat = "orion.heartbeat:main"
orion-voicetest = "orion.voice.devtests:main"
orion-setup = "orion.setup:main"
orion-app = "orion.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

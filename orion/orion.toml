# ---------------------------------------------------------------------------
# Orion configuration.
#
# Everything tunable lives here, not in the code. Thresholds, intervals, the
# model, the voice, which tools need confirmation — changing behaviour should
# be a one-line edit, never a code change. (AGENT.md §7)
#
# Later tiers add sections: [voice] in Tier 3, [memory] in Tier 4,
# [heartbeat] + [checks] in Tier 5, [gate] + [audit] in Tier 6.
# ---------------------------------------------------------------------------

[assistant]
name = "Orion"
# Paths are relative to this file. AGENT.md is read at runtime for the persona.
spec_file = "../AGENT.md"
workspace = "../agent-workspace"

[model]
name = "claude-opus-5"

# How hard the model thinks. Latency is the whole experience in voice, and
# conversational replies are short — "medium" is the deliberate default.
# Raise to "high" or "xhigh" when you want real analysis and can wait for it.
effort = "medium"

max_tokens = 4000
timeout_seconds = 90
max_retries = 2

# Server-side refusal fallback: if a safety classifier declines a request,
# the API routes it to a comparable model instead of returning a dead turn.
refusal_fallback = true

# USD per million tokens, used only for the running cost tally.
price_input_per_mtok = 5.0
price_output_per_mtok = 25.0

[conversation]
# Turns kept in short-term memory before the oldest are dropped. Long-term
# memory (Tier 4) is what survives past this and past a restart.
max_history_messages = 60

# Hard stop on a single turn's tool chain, so a loop can't run away.
max_tool_iterations = 8

[voice]
# --- Ears: Deepgram ---------------------------------------------------------
# "flux" uses Deepgram Flux (conversational model with built-in turn
# detection). "nova" falls back to /v1/listen streaming with endpointing —
# use it if Flux misbehaves; nothing else changes.
stt_engine = "flux"
stt_model_flux = "flux-general-en"
stt_model_fallback = "nova-3"
sample_rate = 16000
# End-of-turn sensitivity (Flux). Higher = waits longer before deciding you're
# done; raise it if you get cut off mid-thought, lower it if replies feel slow.
eot_threshold = 0.7
# Set (e.g. 0.5) to also emit EagerEndOfTurn events for lower perceived latency.
eager_eot_threshold = 0.0

# --- Mouth: ElevenLabs ------------------------------------------------------
# voice_id / tts_model here are DEFAULTS; the ELEVENLABS_VOICE_ID and
# ELEVENLABS_MODEL_ID environment variables (.env) override them.
voice_id = "KyjzVGDMoVqkKJdc4UFh"
tts_model = "eleven_flash_v2_5"
# Raw PCM keeps playback dependency-free; 16000 matches the mic path.
tts_output_format = "pcm_16000"
tts_sample_rate = 16000

# --- Behaviour --------------------------------------------------------------
# Barge-in: speaking while Orion talks stops it immediately and it listens.
barge_in = true
# While Orion is speaking, ignore transcripts that look like its own voice
# leaking into the mic (similarity 0..1 against what it just said).
self_echo_similarity = 0.75
# Print each turn's latency breakdown (T0-T6) while developing.
latency_log = true

[heartbeat]
# How often the loop wakes to see if anything is due. The checks themselves
# run on their own intervals below.
tick_seconds = 30
# Non-urgent surfacing waits for waking hours; only urgent checks break through.
quiet_hours = "22:00-08:00"

[checks.inbox_triage]
enabled = true
interval_minutes = 15
# A file ignored in inbox/ this long stops being quiet and interrupts.
escalate_after_hours = 4

[checks.open_loops]
enabled = true
interval_minutes = 1440   # daily
worklog_gap_days = 3
stale_draft_days = 7
active_clients = "911drain"

[gate]
# Karl's "never without asking" list (AGENT.md §4). Tools declare their own
# consequential edges in code (forget; write_draft on overwrite); anything
# named here is gated unconditionally on top of that — a config edit, not a
# code change. Future send/spend/deploy/git tools get added here the day
# they exist.
always_confirm = ["forget"]
# How long a spoken confirmation waits for an answer before declining.
voice_timeout_seconds = 30.0
